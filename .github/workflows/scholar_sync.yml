# .github/workflows/scholar_sync.yml
#
# Automatically syncs new papers from Google Scholar.
#
# What it does:
#   1. Runs every Sunday at 08:00 UTC (or manually via workflow_dispatch)
#   2. Queries Semantic Scholar (author 3313085) via .github/scripts/scholar_sync.py
#   3. Compares results against _bibliography/papers.bib by DOI, arXiv id and
#      normalised title, skipping anything in _bibliography/scholar_sync_ignore.txt
#   4. If new entries are found, opens a DRAFT Pull Request with the additions
#   5. You review the PR, adjust fields if needed, then merge → site rebuilds
#
# Setup:
#   - No secrets required for public Scholar profiles
#   - The workflow uses GITHUB_TOKEN (auto-provided) to open PRs
#   - Your Scholar ID is: Ys5aNKYAAAAJ
#
# Manual run:
#   Go to Actions → Scholar Sync → Run workflow

name: Scholar Sync

on:
  schedule:
    - cron: "0 8 * * 0"   # Every Sunday at 08:00 UTC
  workflow_dispatch:       # Also runnable manually from GitHub Actions tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check for existing open PR
        id: check_pr
        run: |
          OPEN_PR=$(gh pr list --head scholar-sync/auto-update --state open --json number -q '.[0].number')
          echo "open_pr=$OPEN_PR" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Report stalled sync
        if: steps.check_pr.outputs.open_pr != ''
        run: |
          echo "::warning::Scholar Sync skipped: PR #${{ steps.check_pr.outputs.open_pr }} is still open. Merge or close it to resume syncing."
          echo "### Scholar Sync skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "PR #${{ steps.check_pr.outputs.open_pr }} is still open; merge or close it to resume." >> "$GITHUB_STEP_SUMMARY"

      # Logic lives in .github/scripts/scholar_sync.py (no third-party deps).
      # It dedupes on DOI + arXiv id + normalised title, honours
      # _bibliography/scholar_sync_ignore.txt, and fails the run on errors.
      - name: Fetch new papers from Semantic Scholar
        id: fetch
        if: steps.check_pr.outputs.open_pr == ''
        run: python .github/scripts/scholar_sync.py

      - name: Append new papers to papers.bib
        if: steps.check_pr.outputs.open_pr == '' && steps.fetch.outputs.new_count != '0' && steps.fetch.outputs.new_count != ''
        run: |
          echo "" >> _bibliography/papers.bib
          cat new_papers.bib >> _bibliography/papers.bib
          rm -f new_papers.bib

      - name: Create Pull Request
        if: steps.check_pr.outputs.open_pr == '' && steps.fetch.outputs.new_count != '0' && steps.fetch.outputs.new_count != ''
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: _bibliography/papers.bib
          branch: scholar-sync/auto-update
          delete-branch: true
          draft: true
          title: "📚 Scholar Sync: ${{ steps.fetch.outputs.new_count }} new paper(s) detected"
          body: |
            ## New papers found on Semantic Scholar

            This PR was automatically generated by the Scholar Sync workflow.

            **${{ steps.fetch.outputs.new_count }} new entries** have been appended to `_bibliography/papers.bib`.

            ### Before merging, please:
            - [ ] Review each new entry for correctness
            - [ ] Remove duplicate or incorrect entries — and add each one to
                  `_bibliography/scholar_sync_ignore.txt` with a reason, so it is not re-added
            - [ ] Check entry types: preprints/abstracts are `@misc`, only journal papers are `@article`
            - [ ] Add `selected = {true}` to any featured papers
            - [ ] Add `abstract`, `pdf`, `code`, and `projects` fields

            Papers the sync could not classify (no venue/year) are listed in the workflow run summary.

            Once merged, the site will rebuild automatically.
          commit-message: "chore: add ${{ steps.fetch.outputs.new_count }} new paper(s) from Scholar sync"
          labels: "papers, automated"
